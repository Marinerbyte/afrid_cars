backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "settings"
    label: "1. Profile & Contacts"
    files:
      - label: "Website Settings"
        name: "settings"
        file: "data/settings.json"
        fields:
          - label: "Settings"
            name: "settings"
            widget: "object"
            fields:
              - label: "Profile Photo"
                name: "profilePic"
                widget: "image"
              - label: "Business Name"
                name: "heroTitle"
                widget: "string"
                default: "Afridi Madwani"
              - label: "Tagline"
                name: "tagline"
                widget: "string"
                default: "Premium & Safe Cab Service"
              - label: "Live Status Message (e.g., Available 24x7)"
                name: "statusMessage"
                widget: "string"
                default: "🟢 Available for Outstation Trips"
              - label: "WhatsApp Calling Number (No spaces, start with 91)"
                name: "waNumber"
                widget: "string"
                default: "919876543210"
              - label: "WhatsApp Display Number"
                name: "displayWa"
                widget: "string"
                default: "+91 98765 43210"
              - label: "Phone Display Number"
                name: "displayPhone"
                widget: "string"
                default: "+91 98765 43210"
              - label: "Location"
                name: "location"
                widget: "string"
                default: "Ahmedabad, India"
              - label: "About Text"
                name: "about"
                widget: "text"
                default: "Hello! I am Afridi. We provide the most comfortable cab services."

  - name: "cars"
    label: "2. Manage Cars"
    files:
      - label: "Cars Fleet"
        name: "cars"
        file: "data/cars.json"
        fields:
          - label: "Cars List"
            name: "car_items"
            widget: "list"
            fields:
              - label: "Car Photo"
                name: "image"
                widget: "image"
              - label: "Car Name (e.g., Innova Crysta)"
                name: "name"
                widget: "string"
              - label: "Seats"
                name: "seats"
                widget: "number"
              - label: "AC Type"
                name: "ac"
                widget: "select"
                options:["AC", "Non-AC"]
              - label: "Price / Charge"
                name: "price"
                widget: "string"
                default: "Contact for price"

  - name: "gallery"
    label: "3. Manage Gallery"
    files:
      - label: "Photos"
        name: "gallery"
        file: "data/gallery.json"
        fields:
          - label: "Gallery List"
            name: "gallery_items"
            widget: "list"
            fields:
              - label: "Photo"
                name: "image"
                widget: "image"
              - label: "Caption"
                name: "caption"
                widget: "string"
                required: false
