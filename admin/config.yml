backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "settings"
    label: "1. Profile & Contacts"
    files:
      - label: "Website Settings"
        name: "settings"
        file: "data/settings.json"
        fields:
          - label: "Settings"
            name: "settings"
            widget: "object"
            fields:
              - {label: "Profile Photo", name: "profilePic", widget: "image", required: false}
              - {label: "Business Name", name: "heroTitle", widget: "string", default: "Afridi Cabs"}
              - {label: "Tagline", name: "tagline", widget: "string", default: "Safe & Reliable Travels."}
              - {label: "Status (e.g. Available)", name: "statusMessage", widget: "string", default: "🟢 Available for Booking"}
              - {label: "WhatsApp Calling Number (Start with 91)", name: "waNumber", widget: "string"}
              - {label: "Display WhatsApp", name: "displayWa", widget: "string"}
              - {label: "Display Phone", name: "displayPhone", widget: "string"}
              - {label: "Location", name: "location", widget: "string"}
              - {label: "Short About Text", name: "about", widget: "text"}

  - name: "cars"
    label: "2. Manage Cars (Add Multiple Cars)"
    files:
      - label: "Cars Fleet"
        name: "cars"
        file: "data/cars.json"
        fields:
          - label: "Cars List"
            name: "car_items"
            widget: "list"
            fields:
              - {label: "Car Photo", name: "image", widget: "image"}
              - {label: "Car Name (e.g. Innova)", name: "name", widget: "string"}
              - {label: "Seats", name: "seats", widget: "number"}
              - {label: "AC Type", name: "ac", widget: "select", options: ["AC", "Non-AC"]}
              - {label: "Luggage Space (e.g. 2 Bags)", name: "luggage", widget: "string", default: "2 Bags"}
              - {label: "Deep Details (Carrier, Leg space, condition)", name: "description", widget: "text"}
              - {label: "Price / Estimate", name: "price", widget: "string"}

  - name: "offers"
    label: "3. Offers & Discounts"
    files:
      - label: "Offers List"
        name: "offers"
        file: "data/offers.json"
        fields:
          - label: "Active Offers"
            name: "offer_items"
            widget: "list"
            required: false
            fields:
              - {label: "Offer Title (e.g. 10% Off Airport Drop)", name: "title", widget: "string"}
              - {label: "Details / Promo Code", name: "details", widget: "text"}

  - name: "gallery"
    label: "4. Manage Gallery"
    files:
      - label: "Photos"
        name: "gallery"
        file: "data/gallery.json"
        fields:
          - label: "Gallery List"
            name: "gallery_items"
            widget: "list"
            fields:
              - {label: "Photo", name: "image", widget: "image"}
